name: Mid-review checks

on:
  push:
    branches:
      - mid-review-demo
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and review dependencies
        run: python -m pip install -e ".[dev,mid-review]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run ten-node network and serialization audit
        run: python -m scripts.mid_review_demo --nodes 10 --timeout 25
      - name: Run Ruff
        run: python -m ruff check .
